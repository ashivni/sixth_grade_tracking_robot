<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Uno R3 built-in LED: connection and circuit</title><desc id="desc">Connect a computer to the Uno using USB. Inside the board, PB5, also digital pin 13, connects to the positive input of an LMV358 buffer. Its output feeds back to the negative input and drives a 1 kiloohm resistor and LED L in series to ground. The buffer uses 5 volt power and ground.</desc>
<rect width="1200" height="820" rx="20" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#152c42">
<text x="44" y="55" font-size="31" font-weight="bold">Blink the built-in LED: what connects to what?</text>
<text x="44" y="96" font-size="20" font-weight="bold">1. The connection you make</text>
<rect x="65" y="120" width="195" height="75" rx="10" fill="#e5edf4" stroke="#42586a" stroke-width="2"/>
<text x="103" y="165" font-size="22">Computer</text>
<path d="M260 158H760" stroke="#087f8c" stroke-width="8"/>
<text x="396" y="143" font-size="18">USB cable: power + code</text>
<rect x="760" y="120" width="355" height="75" rx="10" fill="#087f8c"/>
<text x="858" y="165" fill="white" font-size="22">Arduino Uno R3</text>
<text x="44" y="245" font-size="20" font-weight="bold">2. The circuit already inside the board</text>
<rect x="44" y="267" width="1112" height="420" rx="16" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="78" y="398" width="194" height="103" rx="8" fill="#e5edf4" stroke="#42586a" stroke-width="2"/>
<text x="97" y="430" font-size="18" font-weight="bold">ATmega328P</text><text x="97" y="458" font-size="17">PB5 / digital pin 13</text><text x="97" y="485" font-size="15">LED_BUILTIN</text>
<g stroke="#152c42" stroke-width="3" fill="none" stroke-linejoin="round">
<path d="M272 460H420"/>
<path d="M420 380L420 500L550 440Z" fill="#e1f3f0"/>
<path d="M550 440H680 M600 440V345H375V410H420"/>
<path d="M480 408V353 Q494 345 480 337 V323 M480 472V575"/>
<path d="M680 440l10-13 16 26 16-26 16 26 16-26 16 26 10-13H875"/>
<path d="M875 419V461L913 440Z" fill="#ffe69a"/>
<path d="M918 416V464 M913 440H1030V575"/>
<path d="M460 575H500 M467 585H493 M474 595H486 M1010 575H1050 M1017 585H1043 M1024 595H1036"/>
