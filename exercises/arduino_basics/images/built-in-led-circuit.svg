<circle cx="600" cy="440" r="5" fill="#152c42"/>
<text x="431" y="416" font-size="22">−</text><text x="431" y="468" font-size="22">+</text>
<text x="463" y="295" font-size="17">+5 V</text>
<text x="302" y="327" font-size="16">Feedback wire</text>
<text x="516" y="522" font-size="19" font-weight="bold">LED buffer</text><text x="516" y="546" font-size="16">LMV358 (U5B)</text>
<text x="696" y="397" font-size="21" font-weight="bold">1 kΩ</text><text x="675" y="491" font-size="18">Resistor</text>
<text x="854" y="491" font-size="19" font-weight="bold">LED “L”</text><text x="845" y="515" font-size="16">Light comes out</text>
<text x="462" y="623" font-size="17">GND</text><text x="1011" y="623" font-size="17">GND</text>
<text x="79" y="657" font-size="17">GND symbols connect to the same board ground. Other board circuits are omitted.</text>
<text x="44" y="731" font-size="20" font-weight="bold">No breadboard, jumper wires, or separate LED needed.</text>
<text x="44" y="765" font-size="18">The buffer drives the light; the resistor limits current. Your code switches pin 13 HIGH and LOW.</text>
<text x="44" y="796" font-size="16" fill="#475569">Based on the official Uno R3 schematic. Other Arduino boards may wire their built-in LED differently.</text>
</g></svg>
